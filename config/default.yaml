# realtime-camera-filter-ai — default host config
host:
  name: "realtime-camera-filter-ai"
  version: "0.4.2"
  log_level: "info"

capture:
  backend: "dshow"        # dshow | msmf | v4l2 | file
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  fourcc: "MJPG"

pipeline:
  queue_depth: 4
  drop_policy: "latest"   # latest | oldest | block
  inference_pool_size: 2
  post_pool_size: 2

render:
  preview: true
  window_title: "RTCF Preview"
  overlay_stats: true

models:
  weights_dir: "models/weights"
  verify_hashes: true
  default_runtime: "onnxruntime"

plugins:
  registry: "config/plugins.yaml"
  autoload: true
  sandbox_imports: true